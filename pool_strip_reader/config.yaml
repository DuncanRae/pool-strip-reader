name: Pool Strip Reader
version: "0.9.1"
slug: pool_strip_reader
url: https://github.com/DuncanRae/pool-strip-reader
# Prebuilt images from .github/workflows/release.yml. package_ha.py removes this line for a
# local build from source.
image: ghcr.io/duncanrae/pool-strip-reader-{arch}
description: Photograph a pool test strip, get exact dosing, and publish pool sensors
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
homeassistant_api: true
ingress: true
ingress_port: 8745
panel_icon: mdi:pool
panel_title: Pool
backup: cold
stage: experimental
ports:
  8746/tcp: null
ports_description:
  8746/tcp: Optional standalone HTTPS PWA; disabled by default
map:
  - type: ssl
    read_only: true
options:
  weather_entity: ""
  water_temp_entity: ""
  notify_service: ""
  standalone_enabled: false
  standalone_url: ""
  standalone_username: owner
  standalone_password: ""
  certificate_mode: files
  letsencrypt_email: ""
  letsencrypt_terms_accepted: false
  cloudflare_api_token: ""
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  weather_entity: str
  water_temp_entity: str
  notify_service: str
  standalone_enabled: bool
  standalone_url: str
  standalone_username: str?
  standalone_password: password
  certificate_mode: list(files|cloudflare)
  letsencrypt_email: str
  letsencrypt_terms_accepted: bool
  cloudflare_api_token: password
  certfile: str
  keyfile: str
