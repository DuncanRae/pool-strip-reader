# Publishes the app's container images when a GitHub release is published.
#   ghcr.io/duncanrae/pool-strip-reader-amd64:<version>    } read by the Home Assistant app store
#   ghcr.io/duncanrae/pool-strip-reader-aarch64:<version>  } (config.yaml `image:`)
#   ghcr.io/duncanrae/pool-strip-reader:<version> and :latest  one multi-arch image for plain Docker
# The release tag must be v<version>, matching pool_strip_reader/config.yaml.
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.9.1
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/duncanrae/pool-strip-reader

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the tag matches the app version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(sed -n 's/^version: *"\(.*\)"/\1/p' pool_strip_reader/config.yaml)
          if [ "$TAG" != "v$version" ]; then echo "Tag $TAG does not match config.yaml version $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Python tests
        working-directory: pool-app
        run: python3 -m unittest discover -s tests
      - name: JavaScript tests
        working-directory: pool-app
        run: npm run check && npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Assemble the app folder (also checks every version number agrees)
        run: python3 pool-app/scripts/package_ha.py
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/pool_strip_reader
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_VERSION=${{ needs.test.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.test.outputs.version }}
            org.opencontainers.image.description=Pool Strip Reader (Home Assistant app and plain Docker)
          tags: ${{ env.IMAGE }}-${{ matrix.arch }}:${{ needs.test.outputs.version }}

  combine:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One multi-arch image for plain Docker
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            "$IMAGE-amd64:$VERSION" "$IMAGE-aarch64:$VERSION"
